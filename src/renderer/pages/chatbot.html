<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaga Padi - Chatbot</title>
  <link rel="stylesheet" href="../styles/chatbot.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <button class="back-button" onclick="window.location.href='menu.html'">← Back to Menu</button>

    <div class="mode-tabs">
      <button class="tab-button active" id="chatTab" onclick="switchMode('chat')">💬 Mode Chat</button>
      <button class="tab-button" id="paramTab" onclick="switchMode('parameter')">📊 Mode Parameter</button>
    </div>

    <div class="title-content">
      <span class="title-icon">💬</span>
      <span class="title-text">ChatBot - Jaga Padi</span>
    </div>

    <div class="spacer"></div>
  </div>

  <!-- Mode Chat -->
  <div id="chatMode" class="mode-content active">
    <div class="chat-area" id="chatArea">
      <div class="message bot-message">
        <div class="bubble">
          <strong>👋 Halo! Saya asisten Jaga Padi.</strong><br><br>
          Saya bisa membantu Anda dengan:<br>
          • Informasi tentang penyakit padi<br>
          • Tips perawatan tanaman<br>
          • Analisis kondisi sawah<br><br>
          Silakan tanya apa saja!
        </div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Ketik pertanyaan Anda di sini..." onkeypress="handleEnter(event)">
      <button class="send-button" onclick="sendMessage()">Kirim ✈</button>
    </div>
  </div>

  <!-- Mode Parameter -->
  <div id="paramMode" class="mode-content">
    <div class="param-container">
      <h2 class="param-title">📊 Analisis Parameter Sawah</h2>
      <p class="param-subtitle">Masukkan data parameter untuk mendapatkan analisis dan rekomendasi</p>

      <div class="form-card">
        <div class="form-row">
          <label>🌾 Gejala:</label>
          <input type="text" id="gejalaInput" placeholder="Contoh: Daun menguning, bercak coklat">
        </div>
        <div class="form-row">
          <label>🌡️ Suhu (°C):</label>
          <input type="number" id="suhuInput" value="28" step="0.5" min="0" max="50">
        </div>
        <div class="form-row">
          <label>💧 Kelembapan (%):</label>
          <input type="number" id="kelembapanInput" value="70" min="0" max="100">
        </div>
        <div class="form-row">
          <label>⚗️ pH Tanah:</label>
          <input type="number" id="phInput" value="6.5" step="0.1" min="0" max="14">
        </div>
      </div>

      <button class="analyze-button" onclick="analyzeParameters()">🔍 Analisis Sekarang</button>

      <div id="resultCard" class="result-card" style="display: none;">
        <div id="resultContent"></div>
      </div>
    </div>
  </div>

  <script src="../scripts/api-client.js"></script>
  <script src="../scripts/chatbot.js"></script>
</body>
</html>
