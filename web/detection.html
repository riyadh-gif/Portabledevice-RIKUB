<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaga Padi - Deteksi Penyakit</title>
  <link rel="stylesheet" href="/styles/detection.css">
  <link rel="stylesheet" href="/styles/transitions.css">
</head>
<body>
  <div class="header">
    <button class="back-button" onclick="window.location.href='/menu.html'">← Back to Menu</button>
    <div class="mode-tabs">
      <button class="tab-button active" id="uploadTab" onclick="switchMode('upload')">📁 Mode Upload</button>
      <button class="tab-button" id="streamTab" onclick="switchMode('streaming')">📹 Mode Streaming</button>
    </div>
    <div class="title-content">
      <span class="title-icon">🔍</span>
      <span class="title-text">Deteksi Penyakit - Jaga Padi</span>
    </div>
    <div class="spacer"></div>
  </div>

  <div id="uploadMode" class="mode-content active">
    <div class="detection-container">
      <div class="upload-card">
        <div class="image-preview" id="imagePreview">
          <span>📷<br><br>Pilih gambar daun padi<br>untuk dianalisis</span>
        </div>
        <button class="upload-button" onclick="selectImage()">📁 Pilih Gambar</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
      </div>

      <div class="result-card">
        <h3 class="result-title">📊 Hasil Analisis</h3>
        <div class="result-content" id="resultContent">
          Belum ada hasil.<br>Silakan pilih gambar terlebih dahulu.
        </div>
        <button class="detect-button" id="detectButton" onclick="runDetection()" disabled>🔍 Mulai Deteksi</button>
      </div>
    </div>
  </div>

  <div id="streamMode" class="mode-content">
    <div class="streaming-container">
      <div class="camera-card">
        <div class="camera-preview" id="cameraPreview">
          📹<br><br>Kamera Belum Aktif<br><br>Klik 'Mulai Streaming' untuk memulai
        </div>
        <div class="camera-controls">
          <button class="start-button" id="startButton" onclick="startCamera()">▶ Mulai Streaming</button>
          <button class="stop-button" id="stopButton" onclick="stopCamera()" disabled>⏸ Stop Streaming</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/scripts/api-client.js"></script>
  <script src="/scripts/detection.js"></script>
</body>
</html>
