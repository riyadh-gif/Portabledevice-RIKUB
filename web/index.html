<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaga Padi - Loading</title>
  <link rel="stylesheet" href="/styles/splash.css">
  <link rel="stylesheet" href="/styles/transitions.css">
</head>
<body>
  <div class="splash-container">
    <div class="content">
      <div class="icon">🌾</div>
      <h1 class="title">Jaga Padi</h1>
      <p class="subtitle">Smart Rice Field Monitoring System</p>
      <p class="version">Version 1.0.0</p>
      <p class="loading-text">Loading...</p>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    let progress = 0;
    const progressBar = document.getElementById('progressBar');
    const interval = setInterval(() => {
      progress += 2;
      progressBar.style.width = progress + '%';
      if (progress >= 100) {
        clearInterval(interval);
        setTimeout(() => { window.location.href = '/menu.html'; }, 150);
      }
    }, 20);
  </script>
</body>
</html>
